<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilibili 分享海报 · 视觉方向原型（设计原型 / throwaway）</title>
<!--
  设计原型（throwaway）— 不是生产 userscript，不实现任何导出/剪贴板/二维码生成。
  仅用于项目所有者比较 3 个视觉方向：A 报刊信息卡 / B 沉浸封面 / C B站亲和。
  切换：底部浮动条 ←→ 方向、场景按钮、键盘 ←→（输入框聚焦时不拦截）。
-->
<style>
  :root{
    --bili-pink:#FB7299; --bili-blue:#00AEEC; --bili-bg:#18191C; --bili-fg:#F1F2F3;
    --paper:#F7F5F0; --ink:#1A1A1A; --muted:#6B6B66;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#E8E9EB; color:#222; padding-bottom:120px;
  }

  /* ===== 页面环境模拟（Bilibili 视频页操作区） ===== */
  .page-sim{max-width:1200px; margin:0 auto; padding:24px 32px;}
  .bili-nav{
    background:var(--bili-bg); color:var(--bili-fg); border-radius:12px;
    padding:14px 20px; display:flex; align-items:center; gap:16px; margin-bottom:20px;
  }
  .bili-nav .logo{font-weight:700; color:var(--bili-pink); font-size:18px;}
  .bili-nav .nav-hint{font-size:12px; opacity:.6;}
  .video-head{background:#fff; border-radius:12px; padding:20px 24px; box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .video-head h1{font-size:18px; font-weight:600; line-height:1.5; margin-bottom:14px; color:#18191C;}
  .action-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .act{
    border:1px solid #E3E5E7; background:#fff; color:#61666D; border-radius:6px;
    padding:7px 16px; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .act:hover{border-color:#C9CDD2;}
  .act .cnt{color:#18191C; font-weight:600;}
  .official-share{background:#F1F2F3; border-color:#E3E5E7;}
  /* 三个方向的页面入口样式 */
  .entry{font-weight:500; display:inline-flex; align-items:center; gap:6px; cursor:pointer; text-decoration:none;}
  .entry svg{width:15px; height:15px;}
  .entry-A{background:#fff; border:1.5px solid #1A1A1A; color:#1A1A1A; border-radius:6px; padding:6px 14px; font-size:13px;}
  .entry-B{background:#18191C; border:1px solid #18191C; color:#fff; border-radius:6px; padding:7px 16px; font-size:13px;}
  .entry-C{background:var(--bili-pink); border:1px solid var(--bili-pink); color:#fff; border-radius:20px; padding:6px 16px; font-size:13px;}

  /* ===== 分享面板 ===== */
  .panel-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:50;
  }
  .panel-overlay.open{display:flex;}
  .panel{background:#fff; border-radius:12px; box-shadow:0 12px 48px rgba(0,0,0,.3); max-height:92vh; overflow:auto;}
  .panel-close{position:absolute; top:12px; right:14px; border:none; background:rgba(0,0,0,.06); border-radius:50%; width:30px; height:30px; cursor:pointer; font-size:14px; z-index:5;}

  /* 面板 A — 左海报右控制的分栏工具面板 */
  .panelA{position:relative; width:min(900px,94vw); display:flex; gap:0; padding:0;}
  .panelA .preview-side{
    width:46%; background:#F2F3F5; display:flex; flex-direction:column; align-items:center;
    padding:24px 20px; gap:12px; border-radius:12px 0 0 12px;
  }
  .panelA .ctrl-side{width:54%; padding:24px 26px 20px;}
  .panelA .ctrl-side h2{font-size:16px; font-weight:600; margin-bottom:14px;}
  .panelA .opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .panelA .opt{display:flex; align-items:center; justify-content:space-between; border:1px solid #E3E5E7; border-radius:8px; padding:9px 12px; font-size:13px; cursor:pointer;}
  .panelA .opt .lbl{display:flex; align-items:center; gap:7px;}
  .panelA .opt .sub{font-size:11px; color:#9499A0;}
  .panelA .text-preview{background:#FAFAFB; border:1px solid #E3E5E7; border-radius:8px; padding:12px; font-size:12.5px; line-height:1.7; color:#4E5969; min-height:88px; margin-bottom:14px; word-break:break-all; white-space:pre-wrap; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .panelA .export-row{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{font-size:13px; border-radius:6px; padding:8px 14px; cursor:pointer; border:1px solid #E3E5E7; background:#fff;}
  .btn.primary{background:var(--bili-pink); border-color:var(--bili-pink); color:#fff; font-weight:600;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .panelA .status-note{margin-top:12px; font-size:12px; color:#F0902B; background:#FFF7E8; border:1px solid #FFE1A8; border-radius:6px; padding:8px 10px; display:none;}
  .panelA .status-note.show{display:block;}

  /* 面板 B — 沉浸式大图弹层 */
  .panelB{position:relative; width:min(760px,94vw); padding:28px; background:#18191C; color:#F1F2F3; border-radius:16px;}
  .panelB h2{font-size:16px; font-weight:600; text-align:center; margin-bottom:18px; color:#fff;}
  .panelB .poster-stage{display:flex; justify-content:center; margin-bottom:20px;}
  .panelB .ctrl-bar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:#232528; border-radius:10px; padding:12px 16px;}
  .panelB .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .panelB .chip{background:#2E3135; border:1px solid #3D4045; color:#E8E9EB; border-radius:16px; padding:6px 12px; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:6px;}
  .panelB .chip.on{background:rgba(251,114,153,.18); border-color:var(--bili-pink); color:#fff;}
  .panelB .text-preview{background:#101113; border:1px solid #2E3135; border-radius:8px; padding:12px; font-size:12.5px; line-height:1.7; color:#C9CDD2; margin-top:14px; word-break:break-all; white-space:pre-wrap; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .panelB .status-note{margin-top:12px; font-size:12px; color:#FFD591; background:rgba(240,144,43,.12); border:1px solid rgba(240,144,43,.4); border-radius:6px; padding:8px 10px; display:none;}
  .panelB .status-note.show{display:block;}

  /* 面板 C — 官方弹层同族卡片 */
  .panelC{position:relative; width:min(860px,94vw); padding:24px 28px;}
  .panelC h2{font-size:16px; font-weight:600; margin-bottom:16px;}
  .panelC .cols{display:flex; gap:24px;}
  .panelC .preview-side{flex:0 0 340px; background:#F6F7F8; border-radius:12px; padding:18px; display:flex; flex-direction:column; align-items:center; gap:10px;}
  .panelC .ctrl-side{flex:1; min-width:0;}
  .panelC .opt-cards{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .panelC .opt{display:flex; align-items:center; justify-content:space-between; border:1px solid #E3E5E7; border-radius:10px; padding:10px 12px; font-size:13px; cursor:pointer;}
  .panelC .opt .sub{font-size:11px; color:#9499A0;}
  .panelC .text-preview{background:#FAFAFB; border:1px solid #E3E5E7; border-radius:10px; padding:12px; font-size:12.5px; line-height:1.7; color:#4E5969; min-height:90px; margin-bottom:16px; word-break:break-all; white-space:pre-wrap; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .panelC .status-note{margin-bottom:12px; font-size:12px; color:#F0902B; background:#FFF7E8; border:1px solid #FFE1A8; border-radius:6px; padding:8px 10px; display:none;}
  .panelC .status-note.show{display:block;}

  /* ===== 海报（按设计基准缩放显示） ===== */
  .poster{flex:none; background:#fff; box-shadow:0 4px 16px rgba(0,0,0,.18);}
  .poster .qr-zone{position:relative;}
  .qr-zone .qr-tag{position:absolute; right:-2px; bottom:-2px; background:rgba(0,0,0,.55); color:#fff; font-size:9px; padding:2px 5px; border-radius:3px; letter-spacing:.5px;}
  .poster .cover{width:100%; aspect-ratio:16/9; display:block; object-fit:cover; background:#ddd;}
  .poster .cover-wrap{position:relative;}
  .cover-note{position:absolute; left:6px; top:6px; background:rgba(0,0,0,.55); color:#fff; font-size:10px; padding:2px 7px; border-radius:4px; z-index:2;}
  .num{font-variant-numeric:tabular-nums;}
  .ellipsis-2{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .ellipsis-3{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}

  /* 方向 A 海报 — 报刊信息卡（设计基准 320×427，3:4） */
  .posterA{width:320px; aspect-ratio:3/4; background:var(--paper); color:var(--ink); display:flex; flex-direction:column;}
  .posterA .masthead{display:flex; align-items:baseline; justify-content:space-between; padding:10px 14px 6px; border-bottom:2px solid var(--ink);}
  .posterA .masthead .brand{font-size:12px; font-weight:800; letter-spacing:1px;}
  .posterA .masthead .tag{font-size:9px; color:var(--muted); letter-spacing:2px;}
  .posterA .cover-wrap{padding:12px 14px 0;}
  .posterA .cover{border:1px solid #E0DED8; border-radius:3px;}
  .posterA .body{padding:12px 14px 0; flex:1; display:flex; flex-direction:column;}
  .posterA .title{font-size:19px; font-weight:800; line-height:1.35;}
  .posterA .meta-line{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px;}
  .posterA .up{font-size:12px; font-weight:600;}
  .posterA .ids{font-size:10.5px; color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .posterA .part-line{margin-top:7px; display:flex; align-items:center; gap:6px;}
  .posterA .part-chip{background:var(--ink); color:var(--paper); font-size:10.5px; padding:2px 8px; border-radius:2px; letter-spacing:.5px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .posterA .time-chip{font-size:11px; font-weight:700; color:var(--ink); margin-left:auto; font-variant-numeric:tabular-nums;}
  .posterA .stats{display:grid; grid-template-columns:repeat(4,1fr); border:1px solid #DDDBD4; border-top:2px solid var(--ink); margin-top:12px;}
  .posterA .stat{padding:8px 4px 9px; text-align:center; border-right:1px solid #DDDBD4;}
  .posterA .stat:last-child{border-right:none;}
  .posterA .stat .v{font-size:16px; font-weight:800; line-height:1.2;}
  .posterA .stat .k{font-size:9px; color:var(--muted); letter-spacing:1px; margin-top:3px;}
  .posterA .foot{margin-top:auto; display:flex; gap:12px; align-items:center; padding:10px 14px 12px; border-top:1px solid #DDDBD4;}
  .posterA .foot .qr-zone{flex:none; width:78px; height:78px; background:#fff; padding:4px; border:1px solid #E0DED8;}
  .posterA .foot .link-side{min-width:0; flex:1;}
  .posterA .foot .link-label{font-size:9px; letter-spacing:1.5px; color:var(--muted);}
  .posterA .foot .link{font-size:10px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--ink); word-break:break-all; line-height:1.5; margin-top:3px;}

  /* 方向 B 海报 — 沉浸封面（设计基准 300×533，9:16） */
  .posterB{width:300px; aspect-ratio:9/16; background:#000; position:relative; overflow:hidden;}
  .posterB .bg-cover{position:absolute; inset:0; width:100%; height:100%; opacity:.95; display:block;}
  .posterB .scrim{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.08) 0%, rgba(0,0,0,.28) 38%, rgba(0,0,0,.86) 78%, rgba(0,0,0,.94) 100%);}
  .posterB .content{position:relative; z-index:2; display:flex; flex-direction:column; height:100%; padding:14px;}
  .posterB .topline{display:flex; justify-content:space-between; gap:8px;}
  .posterB .part-chip{background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.35); color:#fff; font-size:10.5px; padding:3px 9px; border-radius:14px; max-width:78%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; backdrop-filter:blur(2px);}
  .posterB .time-chip{background:rgba(0,0,0,.55); color:#fff; font-size:11px; font-weight:700; padding:3px 9px; border-radius:14px; font-variant-numeric:tabular-nums; border:1px solid rgba(255,255,255,.25);}
  .posterB .bottom{margin-top:auto;}
  .posterB .title{color:#fff; font-size:19px; font-weight:800; line-height:1.4; text-shadow:0 2px 12px rgba(0,0,0,.7);}
  .posterB .up{color:rgba(255,255,255,.88); font-size:12px; font-weight:600; margin-top:8px;}
  .posterB .stats{display:flex; justify-content:space-between; margin-top:14px; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.14); border-radius:10px; padding:10px 12px; backdrop-filter:blur(3px);}
  .posterB .stat{text-align:center; flex:1;}
  .posterB .stat .v{color:#fff; font-size:14.5px; font-weight:700;}
  .posterB .stat .k{color:rgba(255,255,255,.6); font-size:9px; margin-top:2px; letter-spacing:1px;}
  .posterB .ids{color:rgba(255,255,255,.55); font-size:9.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; text-align:center; margin-top:10px; letter-spacing:.5px;}
  .posterB .foot{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .posterB .foot .qr-zone{flex:none; width:72px; height:72px; background:#fff; padding:4px; border-radius:6px;}
  .posterB .foot .link-side{min-width:0; flex:1;}
  .posterB .foot .link-label{font-size:8.5px; letter-spacing:1.5px; color:rgba(255,255,255,.55);}
  .posterB .foot .link{font-size:9.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:#fff; word-break:break-all; line-height:1.5; margin-top:3px; text-shadow:0 1px 4px rgba(0,0,0,.8);}

  /* 方向 C 海报 — B站亲和卡片（设计基准 320×427，3:4） */
  .posterC{width:320px; aspect-ratio:3/4; background:#fff; border:1px solid #E6E8EB; display:flex; flex-direction:column;}
  .posterC .cover-wrap{padding:12px 12px 0; position:relative;}
  .posterC .cover{border-radius:10px;}
  .posterC .part-chip{position:absolute; left:16px; bottom:8px; background:rgba(24,25,28,.78); color:#fff; font-size:10.5px; padding:3px 10px; border-radius:13px; max-width:80%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .posterC .time-chip{position:absolute; right:16px; bottom:8px; background:rgba(24,25,28,.78); color:#fff; font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:13px; font-variant-numeric:tabular-nums;}
  .posterC .body{padding:12px 14px 0; display:flex; flex-direction:column; flex:1;}
  .posterC .title{font-size:16.5px; font-weight:700; line-height:1.4; color:#18191C;}
  .posterC .up{font-size:11.5px; color:#61666D; margin-top:6px; display:flex; align-items:center; gap:5px;}
  .posterC .up::before{content:""; width:14px; height:14px; border-radius:50%; background:linear-gradient(135deg,#FB7299,#FADB14); flex:none;}
  .posterC .stats{display:grid; grid-template-columns:repeat(4,1fr); background:#F6F7F8; border-radius:10px; padding:9px 6px; margin-top:12px;}
  .posterC .stat{text-align:center;}
  .posterC .stat .v{font-size:14px; font-weight:700; color:#18191C;}
  .posterC .stat .k{font-size:9.5px; color:#9499A0; margin-top:2px;}
  .posterC .foot{border-top:1px solid #F1F2F3; margin-top:auto; padding:10px 14px 12px; display:flex; align-items:center; gap:12px;}
  .posterC .foot .qr-zone{flex:none; width:76px; height:76px; background:#fff; border:1px solid #E6E8EB; border-radius:8px; padding:4px;}
  .posterC .foot .link-side{min-width:0; flex:1;}
  .posterC .foot .link-label{font-size:9px; letter-spacing:1.5px; color:#9499A0;}
  .posterC .foot .link{font-size:10px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:#00AEEC; word-break:break-all; line-height:1.5; margin-top:3px;}
  .posterC .foot .ids{font-size:9px; color:#9499A0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin-top:2px;}

  /* 海报更新遮罩（场景 3） */
  .poster-rebuilding{position:relative;}
  .poster-rebuilding::after{
    content:"正在更新…"; position:absolute; inset:0; background:rgba(255,255,255,.62);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; color:#61666D;
    z-index:4; backdrop-filter:blur(1px);
  }
  .posterB.poster-rebuilding::after{background:rgba(0,0,0,.55); color:#fff;}

  /* ===== 浮动切换条（评审工具，非设计的一部分） ===== */
  .switcher{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:99;
    background:#18191C; color:#fff; border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,.4);
    padding:10px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center;
    font-size:13px; max-width:96vw;
  }
  .switcher .arrow{background:#2E3135; border:1px solid #3D4045; color:#fff; width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:15px;}
  .switcher .variant-label{font-weight:700; min-width:150px; text-align:center;}
  .switcher .scene-row{display:flex; gap:5px; flex-wrap:wrap;}
  .switcher .scene-btn{background:#2E3135; border:1px solid #3D4045; color:#C9CDD2; border-radius:16px; padding:4px 10px; font-size:11.5px; cursor:pointer;}
  .switcher .scene-btn.on{background:var(--bili-pink); border-color:var(--bili-pink); color:#fff;}
  .switcher .panel-toggle{background:var(--bili-pink); border:none; color:#fff; border-radius:8px; padding:6px 14px; font-size:12.5px; cursor:pointer; font-weight:600;}
  .switcher .proto-note{font-size:10px; color:#9499A0; width:100%; text-align:center; letter-spacing:.5px;}
  .qr-tag{display:none;}
  .qr-tag.show{display:block;}

  @media (max-width:760px){
    .panelA{flex-direction:column;}
    .panelA .preview-side{width:100%; border-radius:12px 12px 0 0;}
    .panelA .ctrl-side{width:100%;}
    .panelC .cols{flex-direction:column;}
    .panelC .preview-side{flex:none;}
    .posterA,.posterC{width:280px;}
    .posterB{width:250px;}
  }
</style>
</head>
<body>

<div class="page-sim">
  <div class="bili-nav">
    <span class="logo">bilibili</span>
    <span class="nav-hint">页面环境模拟（设计原型，非真实站点）</span>
  </div>
  <div class="video-head">
    <h1 id="sim-title">视频标题</h1>
    <div class="action-bar">
      <button class="act">👍 <span class="cnt" id="sim-like">284,435</span></button>
      <button class="act">🪙 投币</button>
      <button class="act">⭐ <span class="cnt" id="sim-fav">151,672</span></button>
      <button class="act official-share">↗ 分享（官方）</button>
      <button class="entry" id="entry" data-action="open-panel">分享海报</button>
    </div>
  </div>
</div>

<!-- ===== 分享面板容器 ===== -->
<div class="panel-overlay" id="overlay">
  <div class="panel" id="panel-root"></div>
</div>

<div class="switcher">
  <div class="err-bar" id="err-bar" style="width:100%; text-align:center; font-size:11px; color:#FF9D9D; display:none;"></div>
  <button class="arrow" id="prev" title="上一个方向（←）">◀</button>
  <span class="variant-label" id="variant-label">A — 报刊信息卡</span>
  <button class="arrow" id="next" title="下一个方向（→）">▶</button>
  <span style="opacity:.6;font-size:12px;">场景</span>
  <span class="scene-row" id="scene-row"></span>
  <button class="panel-toggle" id="panel-toggle">打开/关闭面板</button>
  <div class="proto-note">设计原型（throwaway）· 无导出/剪贴板/二维码生成 · 键盘 ← → 切换方向</div>
</div>

<script>
"use strict";
/* ================= 场景数据（同一份数据驱动三个方向，保证内容一致） ================= */
const SCENES = {
  s1: { // 默认：简洁普通文案、生成完成
    name:"默认状态", title:"4K 风光延时摄影 · 川西环线", up:"示例UP主",
    bv:"BV1xx411c7mD", av:"av2", views:"1,234,567", likes:"284,435", coins:"93,210", favs:"151,672",
    part:null, time:null, link:"https://b23.tv/xxxxxxx", fallback:false,
    detail:false, markdown:false, rebuilding:false,

/* 紧凑数字：万/亿，不改变数据含义 */
function compact(v){
  if (v === "--") return "--";
  const n = parseInt(v.replace(/,/g,""), 10);
  if (Number.isNaN(n)) return v;
  if (n >= 100000000) return trimNum(n/100000000) + "亿";
  if (n >= 10000) return trimNum(n/10000) + "万";
  return v;
}
function trimNum(x){ return (Math.round(x*10)/10).toString(); }

/* 分享文案（普通/详细 × 纯文本/Markdown） */
function buildText(s){
  const link = s.link;
  const up = "（UP主：" + s.up + "）";
  const title = s.title;
  if (!s.detail) {
    if (s.markdown) return "[" + title + "](" + link + ")\n" + link;
    return title + up + "\n" + link;
  }
  const lines = [];
  lines.push(s.markdown ? "**" + title + "**" : title);
  lines.push(s.markdown ? "UP主：" + s.up : up);
  lines.push("BV：" + s.bv + " · " + s.av);
  if (s.markdown) {
    lines.push("播放：" + s.views + " · 点赞：" + s.likes + " · 投币：" + s.coins + " · 收藏：" + s.favs);
  } else {
    lines.push("播放：" + s.views + "　点赞：" + s.likes + "　投币：" + s.coins + "　收藏：" + s.favs);
  }
  if (s.part) lines.push(s.part);
  if (s.time) lines.push("时间：" + s.time);
  lines.push(link);
  return lines.join("\n");
}

/* 伪二维码占位（视觉示意，非真实可扫描；真实验证走独立技术原型） */
function fakeQR(seed, size){
  let s = seed * 9301 + 49297;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const n = 21; const cell = size / (n + 2);
  let out = '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" shape-rendering="crispEdges" style="display:block">';
  out += '<rect width="' + size + '" height="' + size + '" fill="#fff"/>';
  const finder = (x,y) => {
    out += '<rect x="' + x*cell + '" y="' + y*cell + '" width="' + cell*7 + '" height="' + cell*7 + '" fill="#000"/>';
    out += '<rect x="' + (x+1)*cell + '" y="' + (y+1)*cell + '" width="' + cell*5 + '" height="' + cell*5 + '" fill="#fff"/>';
    out += '<rect x="' + (x+2)*cell + '" y="' + (y+2)*cell + '" width="' + cell*3 + '" height="' + cell*3 + '" fill="#000"/>';
  };
  for (let r=0; r<n; r++){
    for (let c=0; c<n; c++){
      const inFinder = (r<8&&c<8) || (r<8&&c>=n-8) || (r>=n-8&&c<8);
      if (inFinder) continue;
      if (rnd() > 0.52) out += '<rect x="' + (c+1)*cell + '" y="' + (r+1)*cell + '" width="' + cell + '" height="' + cell + '" fill="#000"/>';
    }
  }
  finder(0,0); finder(n-7,0); finder(0,n-7);
  out += '</svg>';
  return out;
}

/* 封面占位（横向 16:9 渐变示意；真实系统必须在任意横向封面上成立） */
function coverSVG(seed, label, cls){
  if (cls === undefined) cls = "cover";
  const hues = [["#2b5876","#4e4376"],["#134E5E","#71B280"],["#CB356B","#BD3F32"],["#3A1C71","#D76D77"],["#1D2B64","#F8CDDA"]];
  const h = hues[seed % hues.length];
  return '<svg class="'+cls+'" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">' +
    '<defs><linearGradient id="g'+seed+'" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="'+h[0]+'"/><stop offset="1" stop-color="'+h[1]+'"/></linearGradient></defs>' +
    '<rect width="1600" height="900" fill="url(#g'+seed+')"/>' +
    '<circle cx="1200" cy="300" r="220" fill="rgba(255,255,255,.14)"/>' +
    '<circle cx="400" cy="650" r="300" fill="rgba(0,0,0,.12)"/>' +
    '<path d="M0 620 L320 420 L640 560 L960 380 L1280 520 L1600 340 L1600 900 L0 900 Z" fill="rgba(0,0,0,.22)"/>' +
    '<text x="800" y="470" text-anchor="middle" font-size="52" fill="rgba(255,255,255,.92)" font-family="sans-serif" font-weight="700">'+label+'</text>' +

  const s = SCENES[SCENE_KEYS[sIdx]];

  document.getElementById("sim-title").innerHTML = s.title + "　<span style='font-weight:400;font-size:13px;color:#9499A0;'>（模拟视频页操作区）</span>";
  document.getElementById("sim-like").textContent = s.likes;
  document.getElementById("sim-fav").textContent = s.favs;
  document.getElementById("entry").outerHTML = entryHTML();
  // 面板
  const seed = sIdx === 4 ? 2 : sIdx; // 压力场景换封面色相
  document.getElementById("panel-root").innerHTML = VARIANTS[vIdx].render(s, seed);
  // 浮动条
  document.getElementById("variant-label").textContent = VARIANTS[vIdx].label;

    '<button class="scene-btn' + (i===sIdx ? " on" : "") + '" data-action="scene" data-i="' + i + '">' + SCENES[k].name + '</button>').join("");
}

function setVariant(d){
  vIdx = (vIdx + d + VARIANTS.length) % VARIANTS.length;
  render();
  try {
    const p = new URLSearchParams(location.search); p.set("variant", VARIANTS[vIdx].key);
    history.replaceState(null, "", "?" + p.toString());
  } catch (e) { /* file:// 下 replaceState 受限，忽略 */ }
}
function setScene(i){ sIdx = i; render(); }

/* 事件委托：避免内联 onclick 在部分环境下不触发 */
document.addEventListener("click", (e) => {
  const t = e.target.closest ? e.target.closest("[data-action]") : null;
  if (!t) return;
  const a = t.getAttribute("data-action");
  if (a === "open-panel") openPanel();
  if (a === "close-panel") closePanel();
  if (a === "scene") setScene(parseInt(t.getAttribute("data-i"), 10));
});

document.getElementById("prev").addEventListener("click", () => setVariant(-1));
document.getElementById("next").addEventListener("click", () => setVariant(1));
document.getElementById("panel-toggle").addEventListener("click", () => panelOpen ? closePanel() : openPanel());
document.getElementById("overlay").addEventListener("click", (e) => { if (e.target === e.currentTarget) closePanel(); });
document.addEventListener("keydown", (e) => {
  const t = e.target;
  const typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
  if (typing) return;
  if (e.key === "ArrowLeft") setVariant(-1);
  if (e.key === "ArrowRight") setVariant(1);
  if (e.key === "Escape") closePanel();
});

/* 脚本错误可见化：任何异常显示在浮动条上方，便于定位 */
window.addEventListener("error", (e) => {
  const bar = document.getElementById("err-bar");
  if (bar) { bar.style.display = "block"; bar.textContent = "脚本错误：" + (e.message || "unknown") + "（请截图反馈）"; }
});

/* 初始状态：?variant=A|B|C */
const qv = new URLSearchParams(location.search).get("variant");
if (qv) { const i = VARIANTS.findIndex(v => v.key === qv.toUpperCase()); if (i >= 0) vIdx = i; }
render();
</script>
