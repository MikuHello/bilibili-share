<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>分享海报 · 视觉探索</title><link rel="stylesheet" href="style.css"><body>
<!-- Throwaway visual prototype: three structurally different cover-led editorial posters in a simulated video page. No clipboard writes or exports. -->
<svg class="defs" xmlns="http://www.w3.org/2000/svg"><symbol id="image-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.3"/><path d="m4 17 5-5 4 4 3-3 5 5"/></symbol><symbol id="download-icon" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol><symbol id="copy-icon" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol></svg>
<main class="page"><header class="sitehead"><img src="assets/bilibili-logo.svg" alt="哔哩哔哩"><span>视频页面 · 工具栏环境示意</span><button id="theme" class="theme">切换深色</button></header><h1 class="video-title">35min 正念冥想｜把身体作为方法｜从内耗到感受</h1><nav class="toolbar" aria-label="视频工具栏"><button><img src="assets/like.svg" alt="">2662</button><button><img src="assets/coin.svg" alt="">1285</button><button><img src="assets/fav.svg" alt="">6656</button><button><svg viewBox="0 0 24 24"><path d="m14 4 7 7-7 7v-5c-5 0-8 2-11 6 0-8 4-12 11-12z"/></svg>分享</button><button id="entry"><svg><use href="#image-icon"/></svg>生成海报</button></nav>
<section class="panel" aria-labelledby="panel-title"><header class="panel-head"><h2 id="panel-title">分享海报</h2><button id="close" aria-label="关闭分享面板">×</button></header><div class="panel-body"><div class="preview"><article id="poster" class="poster variant-A"></article></div><div class="controls"><div class="marks"><label><input id="part" type="checkbox">标记当前分P</label><label><input id="time" type="checkbox">标记当前时间</label></div><div class="copy-label"><h3>分享文案</h3><div><button data-notice="复制文案">复制文案</button><button data-notice="复制 Markdown">复制 Markdown</button></div></div><div class="copybox"><p id="copytext"></p><p class="copylink" id="copylink"></p></div><label class="details"><input id="details" type="checkbox">详细信息</label><div class="actions"><button class="download" data-notice="下载海报 PNG" aria-label="下载海报 PNG" title="下载海报 PNG"><svg><use href="#download-icon"/></svg></button><button class="primary" data-notice="复制海报"><svg><use href="#copy-icon"/></svg>复制海报</button><button class="combined" data-notice="组合复制仍待通用剪贴板验证"><svg><use href="#image-icon"/></svg>组合复制</button></div></div></div></section></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div><aside class="lab"><div class="lab-tools"><span class="badge">视觉原型</span><label class="upload">更换封面<input id="upload" type="file" accept="image/*"></label><button id="reset">恢复样例</button><span id="palette" class="palette"></span></div><div class="switcher"><button id="prev" aria-label="上一个方案">←</button><div><strong id="variant-label"></strong><small id="variant-note"></small></div><button id="next" aria-label="下一个方案">→</button></div><div id="state" class="state"></div></aside><script src="app.js"></script></body></html>
